<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えびの円卓</title>
<link rel="stylesheet" href="/style.css">
<link rel="preload" href="/fonts/BIZUDPMincho-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/BIZUDPMincho-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/BIZUDPGothic-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/BIZUDPGothic-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="masthead">
  <h1>えびの円卓</h1>
  <p id="heavy-talk" class="heavy-talk"></p>
</header>

<!-- 「いまやること」 (直し31-5): the four steps, the one now lit, and under
     them the one thing to do now. Kept at the top while the page scrolls. -->
<nav id="now" class="now" aria-label="いまやること">
  <ol id="now-steps" class="now-steps"></ol>
  <p id="now-line" class="now-line" aria-live="polite"></p>
</nav>

<main>
  <!-- Before starting: the seven notices and the one Lab question (SPEC 2-1). -->
  <section id="start">
    <p id="start-purpose" class="start-purpose"></p>
    <div class="promises"><ol id="start-notice" class="notice-list"></ol></div>
    <div class="lab-pick">
      <p id="lab-question" class="lab-question"></p>
      <div id="lab-choices" class="choices" role="group" aria-labelledby="lab-question"></div>
    </div>
  </section>

  <!-- The Lab's board folded into the paper plane (直し30の続き-3): over the
       screen a moment; 「とばす」, Enter or Esc ends it. -->
  <div id="fold" class="fold" hidden>
    <svg id="fold-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <polygon id="fold-sheet" class="fold-sheet"></polygon>
      <g id="fold-plane" class="opening-plane">
        <polygon></polygon><polygon></polygon><polygon></polygon>
        <polygon></polygon><polygon></polygon><polygon></polygon>
      </g>
    </svg>
    <button type="button" id="fold-skip" class="quiet"></button>
  </div>

  <!-- One screen (直し32-1): from the first question to 「ふりかえりへ」 the
       page itself never scrolls. In the middle the map and the round table
       (all the height left); at the foot the one box to write in; on the
       right, only when opened, a drawer (the paragraph, the rounds so far,
       the seat list, the seniors' questions). -->
  <section id="table" hidden>
    <div id="stage" class="stage">
      <!-- The map (SPEC 5-1, 14-65): over the seat list, which stays in the
           drawer for the keyboard and screen readers. Hidden when there is no
           map: then the page is as long as before. -->
      <section id="map" class="map" hidden>
        <div class="map-room">
          <div id="map-frame" class="map-frame">
            <!-- 直し41 段2: the map's first stop for the keyboard, seen only
                 when it is there; pressed, the keyboard goes past the points
                 to the first thing pressable in the map's column. -->
            <button type="button" id="map-skip" class="map-skip"></button>
            <svg id="map-svg" role="group" aria-label="えびのの地図と席の点" xmlns="http://www.w3.org/2000/svg"></svg>
            <!-- 直し48 段6: the scenery shown (texts/map_look_label.tsv), in a
                 corner over none of the map's words or bubbles (map.js). -->
            <p id="map-look-label" class="map-look-label" hidden><span class="look-name"></span><span
              class="look-note"></span></p>
            <!-- 直し42: in the middle of the map while the model is waited for,
                 what is being done (texts/wait_sign.tsv). Under the bubbles,
                 never pressed; the line at the top reads it out, not this. -->
            <div id="wait-sign" class="wait-sign" aria-hidden="true" hidden>
              <p id="wait-word" class="wait-word"></p>
              <p id="wait-line" class="wait-line"></p>
              <span class="wait-dots"><span></span><span></span><span></span></span>
            </div>
            <div id="map-overlay" class="map-overlay"></div>
            <!-- The opening (直し30-3): over the map once a Lab is picked, a few
                 seconds; 「とばす」, Enter or Esc ends it. -->
            <div id="opening" class="opening" hidden>
              <svg id="opening-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
                <circle id="opening-ring" class="opening-ring" r="0"></circle>
                <polyline id="opening-trail" class="opening-trail" points=""></polyline>
                <!-- The paper plane (直し30の続き-1): six triangles of folded paper, set by app.js each frame. -->
                <g id="opening-plane" class="opening-plane">
                  <polygon></polygon><polygon></polygon><polygon></polygon>
                  <polygon></polygon><polygon></polygon><polygon></polygon>
                </g>
              </svg>
              <p id="opening-title" class="opening-title" aria-hidden="true"></p>
            </div>
          </div>
        </div>
        <!-- Under the map while the opening plays, where its buttons are after. -->
        <div id="opening-bar" class="opening-bar" hidden>
          <button type="button" id="opening-skip" class="quiet"></button>
        </div>
        <!-- The map's column (直し41 段2), top to bottom in this order, the
             keyboard's too (no CSS order): the seats met; what means
             something now (地図にもどす・円卓にもどす, the split's heading); the
             drawer's buttons, whose words are in among them; at the foot
             ＋, − and 全体 in one band. The words come from
             texts/map_buttons.tsv and texts/drawer_parts.tsv. -->
        <div class="map-bar map-controls">
          <p class="map-met"><span class="map-met-label">会った席</span> <span id="map-met-count" class="map-met-count">0</span></p>
          <div class="map-now">
            <button type="button" id="map-back" class="map-back" hidden></button>
            <button type="button" id="map-reopen" class="map-back" hidden></button>
            <p id="map-heading" class="map-heading"></p>
          </div>
          <div class="map-drawers">
            <!-- Whose words are in the app, and examples of questions (直し31-5):
                 shut (直し33-1), only its small button shows, with the
                 drawer's; pressed, it opens at once over the map; pressed
                 again, Esc or a press outside shuts it. With no map app.js
                 puts it back in the page, before the AI's seat. -->
            <section id="inside" class="inside" hidden>
              <details id="inside-fold">
                <summary id="inside-open"></summary>
                <div class="inside-body">
                  <div class="inside-counts-part">
                    <p id="inside-heading" class="inside-heading"></p>
                    <ul id="inside-counts" class="inside-counts"></ul>
                    <p id="inside-end" class="inside-end"></p>
                  </div>
                  <div class="inside-examples">
                    <p id="examples-lead" class="examples-lead"></p>
                    <ul id="examples" class="examples-list"></ul>
                    <p id="examples-end" class="examples-end"></p>
                    <div id="work-questions" class="hints"></div>
                  </div>
                </div>
              </details>
            </section>
            <div id="drawer-buttons" class="drawer-buttons"></div>
          </div>
          <!-- 今日の道すじ (直し45 段2): the way this student went, in turn,
               from the record (GET /api/trail). In the column where there is
               room; at 1366×650 and upright, shut at first and opened by its
               button over the map's side. -->
          <section id="trail" class="trail" hidden>
            <button type="button" id="trail-open" class="trail-open" aria-expanded="false"
              aria-controls="trail-list"></button>
            <ol id="trail-list" class="trail-list" hidden></ol>
          </section>
          <!-- The map's seasons (the teacher, 11/6): 夜・春・秋, pressed, the
               picture and the ground under it change; nothing else does.
               Shown only when a season's picture is there (map.js). -->
          <div id="map-season" class="map-zoom map-season" role="group" hidden></div>
          <div class="map-zoom">
            <button type="button" id="map-zoom-in"></button>
            <button type="button" id="map-zoom-out"></button>
            <button type="button" id="map-zoom-all"></button>
          </div>
        </div>
      </section>

      <!-- The AI's seat (直し32-3): コーチ and オブザーバー sit here, out of the
           round table's ring and in another shape and colour than the town's
           people; their questions come from here, never as the table's
           bubbles. Pressing one, the box at the foot answers it. -->
      <!-- Back at the map it is folded (直し37-2): its heading and the button
           that opens it, named by the heading (no new words). -->
      <!-- 直し48 段2 (the teacher, 11/7): no heading nor note (the first look
           says they are AI); each question in a bubble from its robot, its
           name with （AI） by it: コーチ at the top left, オブザーバー at the
           bottom right. Folded, the head shows their robots and the button
           that opens it; the seat is named by their names (read out only). -->
      <section id="ai-seat" class="ai-seat" aria-labelledby="ai-seat-label" hidden>
        <p class="ai-seat-head"><span id="ai-seat-faces" class="ai-seat-faces" aria-hidden="true"></span><span
          id="ai-seat-label" class="visually-hidden"></span><button id="ai-seat-open" class="ai-seat-open"
          type="button" aria-expanded="false" aria-controls="ai-seat-cards" aria-labelledby="ai-seat-label"
          hidden></button></p>
        <div id="ai-seat-cards" class="ai-seat-cards"></div>
        <!-- 直し53 段5 (the teacher, 11/7: あの余白に回答を書く方がわかりやすい):
             the answer is written here, under the questions, not in the box
             at the foot. Before one is picked, a quiet line; picked, a box
             of 1 to 3 lines and 送る・やめる (texts/ai_answer_words.tsv). -->
        <p id="ai-seat-pick" class="ai-seat-pick" hidden></p>
        <form id="ai-answer" class="ai-answer" hidden>
          <textarea id="ai-answer-text" rows="2" maxlength="120"></textarea>
          <p class="ai-answer-buttons"><button type="button" id="ai-answer-cancel" class="quiet"></button><button
            type="submit" id="ai-answer-send"></button></p>
        </form>
      </section>
    </div>

    <!-- The drawer (直し32-1): one part at a time, opened by its button;
         閉じる or Esc closes it, the keyboard back where it was. With no map
         every part is shown, one under the other, as before. -->
    <aside id="drawer" class="drawer" aria-labelledby="drawer-title">
      <div class="drawer-head">
        <h2 id="drawer-title" class="drawer-title" tabindex="-1"></h2>
        <button type="button" id="drawer-close" class="quiet drawer-close"></button>
      </div>
      <div class="drawer-body">
        <section id="drawer-paragraph" class="drawer-part" data-part="paragraph"></section>
        <section class="drawer-part" data-part="rounds">
          <section id="rounds"></section>
        </section>
        <section class="seats drawer-part" data-part="seats">
          <h2>席</h2>
          <p class="met">会った席：<span id="met-count">0</span></p>
          <div id="seat-list"></div>
        </section>
        <section id="purposes" class="purposes drawer-part" data-part="purposes">
          <h2 id="purpose-heading"></h2>
          <ul id="purpose-list"></ul>
          <button type="button" id="more-purposes" class="quiet">ほかの見本</button>
        </section>
      </div>
    </aside>

    <!-- At the foot: the one box to write in (直し32-1・2), what came of a
         send just over it, and 「ふりかえりへ」. -->
    <div class="input-area">
      <!-- Said once, the first time bubbles come as spoken words (直し31-7). -->
      <p id="spoken-note" class="spoken-note" hidden></p>
      <p id="ask-message" class="message" hidden></p>
      <!-- Before the reflection, one answer to コーチ or オブザーバー (直し30-1). -->
      <p id="reflect-needs-answer" class="reflect-needs" role="status" hidden></p>
      <!-- What came of the last send: a card made, an AI's question answered. -->
      <p id="input-done" class="input-done" role="status" hidden></p>
      <!-- 行き止まりの道案内 (直し45 段4): no seat answered; the card made,
           and the ways on by kind of talk (no model), each a button. -->
      <div id="ways" class="ways" role="group" aria-labelledby="ways-notice" hidden>
        <p id="ways-notice" class="ways-notice"></p>
        <div id="ways-buttons" class="ways-buttons"></div>
      </div>
      <!-- 直し48 段3 (the teacher, 11/7: 「説明なしでわかる？」): while the
           box answers コーチ or オブザーバー, their question right over it
           (「コーチの問い：…」), so the box is plainly the answer to it. -->
      <p id="input-to-asked" class="input-to-asked" hidden></p>
      <div class="input-row">
        <!-- The one box (直し32-2): on its left, to whom it goes (町の大人みんな,
             one seat, or an AI's question), × back to everyone (Esc too). -->
        <form id="ask-form" class="ask" data-to="all">
          <p class="input-to"><span id="input-to-label" class="input-to-label"></span><button type="button"
            id="input-to-clear" class="input-to-clear" hidden>×</button></p>
          <label for="question" id="question-label" class="visually-hidden">問い</label>
          <textarea id="question" rows="2" maxlength="200"></textarea>
          <button type="submit" id="ask-button">聞く</button>
        </form>
        <p class="to-reflect"><button type="button" id="to-reflect" hidden>ふりかえりへ</button></p>
      </div>
    </div>
    <!-- The map's sources (OpenStreetMap, and Copernicus for the picture), in
         one small line at the very foot. -->
    <p class="map-source"><span id="map-source"></span><span id="map-dem" hidden></span></p>
  </section>

  <!-- The reflection sheet (SPEC 5-2). The student writes first. -->
  <section id="reflect" hidden>
    <h2>ふりかえりの1枚</h2>
    <p class="heavy-talk reflect-heavy-talk"></p>
    <p class="first-question">最初の問い：<span id="first-question"></span></p>

    <form id="reflect-first" class="step">
      <p>最初の問いは変わった？</p>
      <div id="changed-choices" class="choices"></div>
      <label>いまの問い
        <textarea id="now-question" rows="2" maxlength="200"></textarea>
      </label>
      <button type="submit">書いた</button>
      <p id="reflect-message" class="message" hidden></p>
    </form>

    <form id="reflect-answer" class="step" hidden>
      <p class="ask-back" id="ask-back"></p>
      <input id="answer" type="text" maxlength="120" autocomplete="off">
      <div class="choices">
        <button type="submit">答える</button>
        <button type="button" id="decline">答えない</button>
      </div>
    </form>

    <form id="reflect-finish" class="step" hidden>
      <p>次の一手</p>
      <div id="moves" class="moves"></div>
      <input id="own-move" type="text" maxlength="120" autocomplete="off" hidden>
      <label>いまの問いを書き直す（書き直さなくてよい）
        <textarea id="rewrite" rows="2" maxlength="200"></textarea>
      </label>
      <label><span id="meet-question"></span>
        <select id="meet-seat"></select>
      </label>
      <label>理由（1行）
        <input id="meet-reason" type="text" maxlength="120" autocomplete="off">
      </label>
      <button type="submit">この1枚にする</button>
    </form>

    <!-- Today's harvest card (SPEC 5-3): ② right after a seat to hear more
         from is picked (not asked when none is), then the card. -->
    <section id="harvest-use" class="step" hidden>
      <p id="harvest-use-question"></p>
      <div id="uses" class="uses"></div>
      <p id="harvest-message" class="message" hidden></p>
    </section>

    <section id="harvest" class="harvest" hidden>
      <h3 id="harvest-heading"></h3>
      <p id="harvest-moves" hidden></p>
      <p id="harvest-meet" hidden></p>
      <!-- ③ (SPEC 5-3): asked for after ① and ② are shown. -->
      <!-- 直し31-3: the student's question on the left, the subject's card on
           the right (or two to pick from), a line between them. -->
      <div id="harvest-subject" hidden>
        <p id="harvest-subject-link" class="subject-link"></p>
        <div id="harvest-subject-tie" class="subject-tie"></div>
        <button type="button" id="harvest-subject-none" class="quiet" hidden></button>
        <button type="button" id="harvest-subject-more" hidden></button>
      </div>
    </section>

    <dl id="sheet" class="sheet" hidden></dl>

    <!-- Once the sheet is out (直し30-2): back to the first screen for the
         next student, asked once more here, not in the browser's own box. -->
    <div id="back-to-start" class="back-to-start" hidden>
      <button type="button" id="back-start" class="quiet"></button>
      <div id="back-confirm" class="back-confirm" role="group" aria-labelledby="back-confirm-line" hidden>
        <p id="back-confirm-line"></p>
        <div class="choices">
          <button type="button" id="back-yes"></button>
          <button type="button" id="back-no"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 帰る前に、ひとこと (直し38): in place of the reflection sheet unless
       EBINO_REFLECT=old. Its words are texts/hitokoto.tsv's; hitokoto.js
       fills it. As in the teacher's sample, this page scrolls. -->
  <section id="hitokoto" class="hitokoto" hidden>
    <h2 id="hk-title" class="hk-title"></h2>
    <ol id="hk-steps" class="hk-steps"></ol>
    <section id="hk-map" class="hk-part">
      <p id="hk-first-label" class="hk-label"></p>
      <p id="hk-first" class="hk-first"></p>
      <div id="hk-map-box" class="hk-map-box"></div>
      <p id="hk-map-lead" class="hk-label"></p>
      <div id="hk-cards" class="hk-cards"></div>
      <div id="hk-map-buttons" class="hk-row">
        <button type="button" id="hk-go" class="hk-primary" disabled></button>
        <button type="button" id="hk-omakase" class="quiet"></button>
      </div>
    </section>
    <section id="hk-talk" class="hk-part" hidden>
      <!-- 直し48 段7: today's trail beside the talk (above it, folded, when
           narrow); a step pressed opens what was heard then, as recorded. -->
      <aside id="hk-trail" class="hk-trail" aria-labelledby="hk-trail-title" hidden>
        <details id="hk-trail-fold"><summary id="hk-trail-title"></summary><ol id="hk-trail-list"
          class="hk-trail-list"></ol></details>
      </aside>
      <div id="hk-log" class="hk-log" aria-live="polite"></div>
      <div id="hk-input" class="hk-input"></div>
      <p class="hk-exit"><button type="button" id="hk-stop" class="quiet"></button></p>
    </section>
    <section id="hk-light" class="hk-part" hidden>
      <div id="hk-light-box" class="hk-light" aria-live="polite"></div>
      <label for="hk-now" id="hk-now-label" class="hk-label"></label>
      <textarea id="hk-now" rows="2" maxlength="200"></textarea>
      <!-- 直し54: the student's own lines today; one press puts it in the box above. -->
      <div id="hk-now-choices" class="hk-now-choices" hidden>
        <p id="hk-now-pick" class="hk-now-pick"></p>
        <div id="hk-now-list" class="hk-now-list"></div>
      </div>
      <p id="hk-now-message" class="message" role="status" hidden></p>
      <div class="hk-row"><button type="button" id="hk-to-sheet" class="hk-primary"></button></div>
    </section>
    <!-- The one sheet: only this is printed, with no name on it. -->
    <section id="hk-sheet" class="hk-part" hidden>
      <article id="hk-sheet-body" class="hk-sheet"></article>
      <div class="hk-row hk-print-row">
        <button type="button" id="hk-print" class="hk-primary"></button>
        <span id="hk-print-side" class="hk-label"></span>
      </div>
      <div id="hk-back" class="hk-back"></div>
    </section>
    <p class="heavy-talk hk-heavy-talk"></p>
  </section>
</main>

<!-- The first look (the teacher, 11/6): once a Lab is picked and the table
     is out, before the first question, one window comes up by itself in the
     middle of the screen, two pages one after the other: what the app is and
     how it goes (the band's four steps in a row with arrows), then 次へ,
     whose words are in. Its last button (or Esc) puts those back in the
     map's column and the keyboard goes to the box. app.js moves #inside's
     body in and out. -->
<!-- 直し48 段1 (the teacher, 11/7: the more on one page, the more is
     skipped): five pages, one thing each, 次へ and 戻る at the foot, always in
     the window; the pages that have nothing (no coach nor observer, no words
     in) are left out. 1 the host's hello, 2 how it goes, 3 コーチ and
     オブザーバー, 4 whose words are in, 5 examples of questions. -->
<dialog id="first-look" class="first-look" aria-labelledby="first-look-about-title">
  <div class="first-look-pages">
    <section id="first-look-about" class="first-look-page" data-page="hello">
      <!-- Said by the host (the teacher, 11/6), 司会（AI）'s robot (直し48,
           robot.js) by its name, its words in a bubble from it. -->
      <h2 id="first-look-about-title" class="first-look-title host-head"><span id="host-mark" class="host-mark"
        aria-hidden="true"></span><span id="host-name"></span></h2>
      <div id="start-about" class="start-about host-says"></div>
    </section>
    <section id="first-look-flow" class="first-look-page" data-page="flow" hidden>
      <h2 id="first-look-flow-title" class="first-look-title" tabindex="-1"></h2>
      <ol id="start-flow" class="start-flow" aria-label="すすみ方"></ol>
    </section>
    <!-- コーチとオブザーバー (the teacher, 11/6; 直し46): the AI's questions
         at the end of a round, a card for each; the page left out with none. -->
    <section id="first-look-roles" class="first-look-page" data-page="roles" hidden>
      <div id="start-roles" class="start-roles" hidden>
        <h2 id="start-roles-lead" class="first-look-title start-roles-lead" tabindex="-1"></h2>
        <ul id="start-roles-list" class="start-roles-list"></ul>
        <p id="start-roles-note" class="start-roles-note"></p>
      </div>
    </section>
    <section id="first-look-inside" class="first-look-page" data-page="inside" hidden>
      <h2 id="first-look-title" class="first-look-title" tabindex="-1"></h2>
      <div id="first-look-body" class="first-look-body"></div>
    </section>
    <section id="first-look-examples" class="first-look-page" data-page="examples" hidden>
      <div id="first-look-examples-body" class="first-look-body"></div>
    </section>
  </div>
  <div class="first-look-foot">
    <ol id="first-look-dots" class="first-look-dots" aria-hidden="true"></ol>
    <button type="button" id="first-look-back" class="quiet first-look-back" disabled></button>
    <button type="button" id="first-look-next" class="first-look-go" autofocus></button>
  </div>
</dialog>

<!-- The guide (the teacher, 11/6): a bubble by the one thing to press now,
     pointing at it. Never pressed; the line at the top reads it out. -->
<div id="guide" class="guide" aria-hidden="true" hidden><span id="guide-text"></span></div>

<script src="/rough.js"></script>
<script src="/person.js"></script>
<script src="/robot.js"></script>
<script src="/map.js"></script>
<script src="/hitokoto.js"></script>
<script src="/app.js"></script>
</body>
</html>
