<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>えびの円卓</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="masthead">
  <h1>えびの円卓</h1>
</header>

<!-- 「いまやること」 (直し31-5): the four steps, the one now lit, and under
     them the one thing to do now. Kept at the top while the page scrolls. -->
<nav id="now" class="now" aria-label="いまやること">
  <ol id="now-steps" class="now-steps"></ol>
  <p id="now-line" class="now-line" aria-live="polite"></p>
</nav>

<main>
  <!-- Before starting: the seven notices and the one Lab question (SPEC 2-1). -->
  <section id="start">
    <p id="start-purpose" class="start-purpose"></p>
    <div class="promises"><ol id="start-notice" class="notice-list"></ol></div>
    <div class="lab-pick">
      <p id="lab-question" class="lab-question"></p>
      <div id="lab-choices" class="choices" role="group" aria-labelledby="lab-question"></div>
    </div>
  </section>

  <!-- The Lab's board folded into the paper plane (直し30の続き-3): over the
       screen a moment; 「とばす」, Enter or Esc ends it. -->
  <div id="fold" class="fold" hidden>
    <svg id="fold-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <polygon id="fold-sheet" class="fold-sheet"></polygon>
      <g id="fold-plane" class="opening-plane">
        <polygon></polygon><polygon></polygon><polygon></polygon>
        <polygon></polygon><polygon></polygon><polygon></polygon>
      </g>
    </svg>
    <button type="button" id="fold-skip" class="quiet"></button>
  </div>

  <section id="table" hidden>
    <p id="heavy-talk" class="heavy-talk"></p>

    <!-- Whose words are in the app, and examples of questions (直し31-5):
         open until the first question is sent, then folded. -->
    <section id="inside" class="inside" hidden>
      <details id="inside-fold" open>
        <summary id="inside-open"></summary>
        <div class="inside-body">
          <div class="inside-counts-part">
            <p id="inside-heading" class="inside-heading"></p>
            <ul id="inside-counts" class="inside-counts"></ul>
            <p id="inside-end" class="inside-end"></p>
          </div>
          <div class="inside-examples">
            <p id="examples-lead" class="examples-lead"></p>
            <ul id="examples" class="examples-list"></ul>
            <p id="examples-end" class="examples-end"></p>
          </div>
        </div>
      </details>
    </section>

    <form id="ask-form" class="ask">
      <label for="question" class="visually-hidden">問い</label>
      <textarea id="question" rows="2" maxlength="200"></textarea>
      <button type="submit" id="ask-button">聞く</button>
    </form>
    <div id="work-questions" class="hints"></div>
    <p id="ask-message" class="message" hidden></p>

    <!-- The map (SPEC 5-1, 14-65): added over the seat list below, which stays
         for the keyboard and screen readers. Hidden when there is no map. -->
    <section id="map" class="map" hidden>
      <div id="map-frame" class="map-frame">
        <svg id="map-svg" role="group" aria-label="えびのの地図と席の点" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="map-overlay" class="map-overlay"></div>
        <!-- The opening (直し30-3): over the map once a Lab is picked, a few
             seconds; 「とばす」, Enter or Esc ends it. -->
        <div id="opening" class="opening" hidden>
          <svg id="opening-svg" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
            <circle id="opening-ring" class="opening-ring" r="0"></circle>
            <polyline id="opening-trail" class="opening-trail" points=""></polyline>
            <!-- The paper plane (直し30の続き-1): six triangles of folded paper, set by app.js each frame. -->
            <g id="opening-plane" class="opening-plane">
              <polygon></polygon><polygon></polygon><polygon></polygon>
              <polygon></polygon><polygon></polygon><polygon></polygon>
            </g>
          </svg>
          <p id="opening-title" class="opening-title" aria-hidden="true"></p>
        </div>
      </div>
      <!-- Under the map while the opening plays, where its buttons are after. -->
      <div id="opening-bar" class="opening-bar" hidden>
        <button type="button" id="opening-skip" class="quiet"></button>
      </div>
      <!-- Under the map, never over it: 地図にもどす, the table's heading and
           the zoom buttons; the buttons' words come from texts/map_buttons.tsv. -->
      <div class="map-bar map-controls">
        <button type="button" id="map-back" class="map-back" hidden></button>
        <p id="map-heading" class="map-heading"></p>
        <!-- Said once, the first time bubbles come as spoken words (直し31-7). -->
        <p id="spoken-note" class="spoken-note" hidden></p>
        <div class="map-zoom">
          <button type="button" id="map-zoom-in"></button>
          <button type="button" id="map-zoom-out"></button>
          <button type="button" id="map-zoom-all"></button>
        </div>
      </div>
      <div class="map-foot">
        <p class="map-met">会った席 <span id="map-met-count">0</span></p>
        <!-- The map's sources: OpenStreetMap, and Copernicus for the picture. -->
        <p class="map-source"><span id="map-source"></span><span id="map-dem" hidden></span></p>
      </div>
      <div id="map-card" class="map-card" hidden></div>
    </section>

    <section id="purposes" class="purposes">
      <h2 id="purpose-heading"></h2>
      <ul id="purpose-list"></ul>
      <button type="button" id="more-purposes" class="quiet">ほかの見本</button>
    </section>

    <section id="rounds"></section>

    <p class="to-reflect"><button type="button" id="to-reflect" hidden>ふりかえりへ</button></p>
    <!-- Before the reflection, one answer to コーチ or オブザーバー (直し30-1). -->
    <p id="reflect-needs-answer" class="reflect-needs" role="status" hidden></p>

    <section class="seats">
      <h2>席</h2>
      <p class="met">会った席：<span id="met-count">0</span></p>
      <div id="seat-list"></div>
    </section>
  </section>

  <!-- The reflection sheet (SPEC 5-2). The student writes first. -->
  <section id="reflect" hidden>
    <h2>ふりかえりの1枚</h2>
    <p class="heavy-talk reflect-heavy-talk"></p>
    <p class="first-question">最初の問い：<span id="first-question"></span></p>

    <form id="reflect-first" class="step">
      <p>最初の問いは変わった？</p>
      <div id="changed-choices" class="choices"></div>
      <label>いまの問い
        <textarea id="now-question" rows="2" maxlength="200"></textarea>
      </label>
      <button type="submit">書いた</button>
      <p id="reflect-message" class="message" hidden></p>
    </form>

    <form id="reflect-answer" class="step" hidden>
      <p class="ask-back" id="ask-back"></p>
      <input id="answer" type="text" maxlength="120" autocomplete="off">
      <div class="choices">
        <button type="submit">答える</button>
        <button type="button" id="decline">答えない</button>
      </div>
    </form>

    <form id="reflect-finish" class="step" hidden>
      <p>次の一手</p>
      <div id="moves" class="moves"></div>
      <input id="own-move" type="text" maxlength="120" autocomplete="off" hidden>
      <label>いまの問いを書き直す（書き直さなくてよい）
        <textarea id="rewrite" rows="2" maxlength="200"></textarea>
      </label>
      <label><span id="meet-question"></span>
        <select id="meet-seat"></select>
      </label>
      <label>理由（1行）
        <input id="meet-reason" type="text" maxlength="120" autocomplete="off">
      </label>
      <button type="submit">この1枚にする</button>
    </form>

    <!-- Today's harvest card (SPEC 5-3): ② right after a seat to hear more
         from is picked (not asked when none is), then the card. -->
    <section id="harvest-use" class="step" hidden>
      <p id="harvest-use-question"></p>
      <div id="uses" class="uses"></div>
      <p id="harvest-message" class="message" hidden></p>
    </section>

    <section id="harvest" class="harvest" hidden>
      <h3 id="harvest-heading"></h3>
      <p id="harvest-moves" hidden></p>
      <p id="harvest-meet" hidden></p>
      <!-- ③ (SPEC 5-3): asked for after ① and ② are shown. -->
      <!-- 直し31-3: the student's question on the left, the subject's card on
           the right (or two to pick from), a line between them. -->
      <div id="harvest-subject" hidden>
        <p id="harvest-subject-link" class="subject-link"></p>
        <div id="harvest-subject-tie" class="subject-tie"></div>
        <button type="button" id="harvest-subject-none" class="quiet" hidden></button>
        <button type="button" id="harvest-subject-more" hidden></button>
      </div>
    </section>

    <dl id="sheet" class="sheet" hidden></dl>

    <!-- Once the sheet is out (直し30-2): back to the first screen for the
         next student, asked once more here, not in the browser's own box. -->
    <div id="back-to-start" class="back-to-start" hidden>
      <button type="button" id="back-start" class="quiet"></button>
      <div id="back-confirm" class="back-confirm" role="group" aria-labelledby="back-confirm-line" hidden>
        <p id="back-confirm-line"></p>
        <div class="choices">
          <button type="button" id="back-yes"></button>
          <button type="button" id="back-no"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<template id="card-form-template">
  <form class="card-form">
    <label>この人に聞きたいこと
      <textarea rows="2" maxlength="200"></textarea>
    </label>
    <button type="submit">質問カードにする</button>
  </form>
</template>

<script src="/rough.js"></script>
<script src="/map.js"></script>
<script src="/app.js"></script>
</body>
</html>
