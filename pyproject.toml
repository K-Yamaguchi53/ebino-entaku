[project]
name = "ebino-entaku"
version = "0.1.0"
description = "A round table on the map of Ebino: high school students meet the real words of local adults and seniors."
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "anthropic==1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "reportlab>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ebino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
